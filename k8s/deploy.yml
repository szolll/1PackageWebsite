---
# ── Deployment ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onepackage
  namespace: default
  labels:
    app: onepackage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: onepackage
  template:
    metadata:
      labels:
        app: onepackage
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: html
          configMap:
            name: onepackage-html
        - name: nginx-conf
          configMap:
            name: onepackage-nginx-conf

---
# ── Service ───────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: onepackage
  namespace: default
spec:
  type: NodePort
  selector:
    app: onepackage
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
