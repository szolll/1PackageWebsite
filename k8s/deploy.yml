---
# ── nginx config ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: onepackage-nginx-conf
  namespace: default
data:
  nginx.conf: |
    server {
      listen 80;
      root /usr/share/nginx/html;
      index index.html;

      add_header Content-Security-Policy "default-src 'self'; style-src 'unsafe-inline'; frame-src https://www.openstreetmap.org; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org;" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;

      error_page 404 /404.html;
      location = /404.html { internal; }

      location / {
        try_files $uri $uri.html $uri/ =404;
      }
    }

