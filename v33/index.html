<!DOCTYPE html><meta charset=UTF-8><meta name=viewport content="width=device-width"><title>Match</title><style>*{margin:0}body{height:100vh;display:grid;place-items:center;font:14px system-ui;background:#1a1a2e;color:#fff}h2{margin-bottom:12px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.g div{width:50px;height:50px;background:#16213e;border-radius:6px;display:grid;place-items:center;font-size:20px;cursor:pointer;transition:.2s}.g div:hover{background:#1f4068}.g div.f{background:#e94560}.g div.m{background:#0f3460;cursor:default}#s{margin-top:12px;color:#888}</style><h2>Memory</h2><div class=g id=g></div><p id=s>Find all pairs!</p><script>let c='AABBCCDD'.repeat(2).split('').sort(()=>Math.random()-.5),f=[],m=0;g.innerHTML=c.map((v,i)=>'<div data-i='+i+' data-v='+v+'></div>').join('');g.onclick=e=>{let d=e.target;if(!d.dataset.i||d.classList.contains('m')||f.length==2)return;d.textContent=d.dataset.v;d.classList.add('f');f.push(d);if(f.length==2){if(f[0].dataset.v==f[1].dataset.v){f.forEach(x=>x.classList.add('m'));m+=2;if(m==16)s.textContent='You win!'}else setTimeout(()=>f.forEach(x=>{x.textContent='';x.classList.remove('f')}),600);f=[]}}</script>
