<!DOCTYPE html><meta charset=UTF-8><meta name=viewport content="width=device-width"><title>RPS</title><style>*{margin:0}body{height:100vh;display:grid;place-items:center;font:16px system-ui;background:#2d3436;color:#fff;text-align:center}h2{margin-bottom:16px}.b{display:flex;gap:12px}.b button{width:70px;height:70px;border:0;border-radius:12px;font-size:32px;cursor:pointer;background:#636e72;transition:.2s}.b button:hover{background:#74b9ff;transform:scale(1.1)}#r{font-size:48px;margin:20px 0}#m{color:#dfe6e9;font-size:18px}#s{color:#b2bec3;margin-top:12px}</style><h2>Rock Paper Scissors</h2><div class=b><button onclick=p(0)>🪨</button><button onclick=p(1)>📄</button><button onclick=p(2)>✂️</button></div><div id=r>🆚</div><div id=m>Pick one!</div><div id=s>You: 0 | CPU: 0</div><script>let y=0,c=0,n=['🪨','📄','✂️'];function p(u){let x=Math.floor(Math.random()*3);r.textContent=n[u]+' vs '+n[x];let w=(3+u-x)%3;if(w==1){y++;m.textContent='You win!';m.style.color='#00b894'}else if(w==2){c++;m.textContent='CPU wins!';m.style.color='#d63031'}else{m.textContent='Draw!';m.style.color='#fdcb6e'}s.textContent='You: '+y+' | CPU: '+c}</script>
