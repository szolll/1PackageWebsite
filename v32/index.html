<!DOCTYPE html><meta charset=UTF-8><meta name=viewport content="width=device-width"><title>React</title><style>*{margin:0}body{height:100vh;display:grid;place-items:center;font:16px system-ui;background:#111;color:#fff;text-align:center}#b{width:200px;height:200px;border-radius:50%;border:0;background:#e74c3c;cursor:pointer;transition:background .1s}#b.wait{background:#e74c3c}#b.go{background:#2ecc71}#b.early{background:#e67e22}#t{font-size:32px;margin-bottom:20px}#r{color:#888;font-size:14px;margin-top:16px}</style><p id=t>Wait for green...</p><button id=b class=wait></button><p id=r>Click when it turns green!</p><script>let s,w,x=0;b.onclick=()=>{if(x==1){let d=Date.now()-s;t.textContent=d+'ms';r.textContent=d<200?'Incredible!':d<300?'Great!':'Good';b.className='wait';x=0}else if(x==2){clearTimeout(w);t.textContent='Too early!';b.className='early';x=0;setTimeout(go,1e3)}else go()};function go(){x=2;t.textContent='Wait...';b.className='wait';w=setTimeout(()=>{x=1;s=Date.now();t.textContent='CLICK!';b.className='go'},1e3+Math.random()*3e3)}</script>
