<!DOCTYPE html><meta charset=UTF-8><meta name=viewport content="width=device-width"><title>Guess</title><style>*{margin:0}body{height:100vh;display:grid;place-items:center;font:16px system-ui;background:#0d1b2a;color:#fff;text-align:center}h2{color:#e0e1dd}#n{width:80px;padding:12px;font-size:24px;border:2px solid #415a77;border-radius:8px;background:#1b263b;color:#fff;text-align:center}#b{padding:12px 24px;margin-left:8px;border:0;border-radius:8px;background:#e63946;color:#fff;font-size:16px;cursor:pointer}#b:hover{background:#d62839}#h{margin:16px 0;font-size:18px;color:#778da9}#t{color:#888;font-size:14px}#r{margin-top:12px;padding:8px 16px;border:1px solid #415a77;border-radius:6px;background:#0000;color:#778da9;cursor:pointer}</style><h2>Guess 1-100</h2><p id=h>Enter a number</p><div><input type=number id=n min=1 max=100><button id=b>Go</button></div><p id=t>Tries: 0</p><button id=r>New Game</button><script>let a=Math.ceil(Math.random()*100),t=0;b.onclick=()=>{let g=+n.value;if(!g)return;t++;document.getElementById('t').textContent='Tries: '+t;h.textContent=g<a?'Higher!':g>a?'Lower!':'Correct in '+t+'!';h.style.color=g==a?'#2ecc71':'#e63946'};r.onclick=()=>{a=Math.ceil(Math.random()*100);t=0;h.textContent='Enter a number';h.style.color='#778da9';document.getElementById('t').textContent='Tries: 0';n.value=''}</script>
