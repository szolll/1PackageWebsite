<!DOCTYPE html><meta charset=UTF-8><meta name=viewport content="width=device-width"><title>Click</title><style>*{margin:0}body{height:100vh;display:grid;place-items:center;font:16px system-ui;background:#0f0f23;color:#fff;text-align:center}#c{font-size:48px;color:#0f0}#b{width:120px;height:120px;border-radius:50%;border:0;background:linear-gradient(145deg,#1a1a3e,#0a0a1e);color:#fff;font-size:24px;cursor:pointer;box-shadow:0 0 30px #0f03}#b:hover{box-shadow:0 0 50px #0f06}#b:active{transform:scale(.95)}#u{margin-top:20px;padding:10px 20px;border:1px solid #333;border-radius:8px;background:#0000;color:#888;cursor:pointer}#u:hover{border-color:#0f0;color:#0f0}p{margin-top:12px;color:#666;font-size:13px}#m{color:#0f0}</style><div id=c>0</div><button id=b>CLICK</button><button id=u>+1 Multi (Cost: 10)</button><p>Multi: <span id=m>1</span>x</p><script>let n=0,m=1,p=10;b.onclick=()=>{n+=m;c.textContent=n};u.onclick=()=>{if(n>=p){n-=p;m++;p=Math.floor(p*1.5);c.textContent=n;m_el=document.getElementById('m');m_el.textContent=m;u.textContent='+1 Multi (Cost: '+p+')'}}</script>
