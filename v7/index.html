<!DOCTYPE html><html><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Soft UI</title><style>*{margin:0;box-sizing:border-box}body{height:100vh;display:grid;place-items:center;font:16px/1.5 system-ui;background:#e0e5ec;color:#555}.c{padding:30px;border-radius:20px;background:#e0e5ec;box-shadow:8px 8px 16px #b8bec7,-8px -8px 16px #fff}h1{font-size:24px;color:#444;margin-bottom:12px}p{margin-bottom:15px;color:#666}.n{display:flex;gap:10px;flex-wrap:wrap}a{padding:10px 18px;border-radius:10px;background:#e0e5ec;box-shadow:4px 4px 8px #b8bec7,-4px -4px 8px #fff;color:#555;text-decoration:none;font-size:14px;transition:.2s}a:hover{box-shadow:inset 4px 4px 8px #b8bec7,inset -4px -4px 8px #fff}a:active{box-shadow:inset 2px 2px 4px #b8bec7,inset -2px -2px 4px #fff}footer{margin-top:20px;font-size:12px;color:#888}</style></head><body><div class=c><h1>Soft UI</h1><p>Neumorphic design with soft shadows and subtle depth.</p><nav class=n><a href=#>Home</a><a href=#>About</a><a href=#>Work</a><a href=#>Contact</a></nav><footer>1 packet, pure CSS</footer></div></body></html>
