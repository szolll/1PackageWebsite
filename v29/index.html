<!DOCTYPE html><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Grid</title><style>*{margin:0}body{min-height:100vh;display:grid;place-items:center;font:13px system-ui;background:#0a0a0a;color:#fff}.g{display:grid;grid-template-columns:repeat(3,80px);gap:8px}.g div{height:80px;background:#161616;border-radius:8px;display:grid;place-items:center;transition:.2s}.g div:hover{background:#222;transform:scale(1.05)}.g div:nth-child(1){background:linear-gradient(135deg,#6366f1,#8b5cf6)}.g div:nth-child(5){font-size:20px}.g div:nth-child(9){background:#262626}h3{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:1px;margin-top:16px;text-align:center}</style><div class=g><div>Hi</div><div>01</div><div>02</div><div>03</div><div>✦</div><div>05</div><div>06</div><div>07</div><div>→</div></div><h3>Select a tile</h3>
